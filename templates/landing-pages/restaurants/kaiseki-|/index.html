
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAISEKI | Japanese Minimalist Dining</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;500;900&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e84f30",
              "background-light": "#f8f6f6",
              "background-dark": "#0d0d0d",
              "charcoal": "#121212",
              "cedar": "#382b29"
            },
            fontFamily: {
              "display": ["Work Sans", "sans-serif"],
              "serif-jp": ["Noto Serif JP", "serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
    <style>
      .writing-vertical {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      .wood-texture {
        background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        opacity: 0.05;
      }
      .glass-dark {
        background: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(12px);
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-dark font-display text-gray-100 selection:bg-primary/30 antialiased overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
