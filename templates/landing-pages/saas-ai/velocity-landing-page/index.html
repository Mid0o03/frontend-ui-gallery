
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloCity - The Future is Fast</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f9e71f',
                        carbon: '#0a0a0a',
                        surface: '#121212',
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .skew-bg { transform: skewY(-3deg); }
        .skew-content { transform: skewY(3deg); }
        .perspective { perspective: 1500px; }
        .phone-left { transform: rotateY(30deg) rotateX(10deg) translateX(-80px) translateZ(-50px); }
        .phone-right { transform: rotateY(-30deg) rotateX(10deg) translateX(80px) translateZ(-50px); }
        .phone-center { transform: translateZ(50px); }
        body { background-color: #0a0a0a; color: white; }
    </style>
