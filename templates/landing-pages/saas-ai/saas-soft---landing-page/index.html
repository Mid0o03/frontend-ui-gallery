
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Soft - Simplifiez votre workflow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#2b8cee",
            "pastel-blue": "#e6f0ff",
            "background-light": "#f6f7f8",
            "text-dark": "#111418"
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          boxShadow: {
            'soft-raised': '8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff',
            'soft-pressed': 'inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff',
            'soft-card': '12px 12px 24px #d1d9e6, -12px -12px 24px #ffffff',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      scroll-behavior: smooth;
    }
    .soft-bg-blob {
      position: absolute;
      z-index: -1;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.5;
    }
  </style>
