
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLTAPP | Move at the Speed of Light</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: "#ffff00",
              "background-light": "#f8f8f5",
              "background-dark": "#121212",
              carbon: "#1a1a1a",
            },
            fontFamily: {
              display: ["Space Grotesk", "sans-serif"],
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      .skew-divider {
        clip-path: polygon(0 0, 100% 5%, 100% 100%, 0 95%);
      }
      .hero-skew {
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
      }
      .text-glow {
        text-shadow: 0 0 15px rgba(255, 255, 0, 0.4);
      }
      .mockup-float {
        filter: drop-shadow(0 0 30px rgba(255, 255, 0, 0.2));
      }
      body {
        background-color: #121212;
        color: white;
        font-family: 'Space Grotesk', sans-serif;
      }
      /* Hide scrollbar for chrome, safari and opera */
      ::-webkit-scrollbar {
        display: none;
      }
    </style>

}
