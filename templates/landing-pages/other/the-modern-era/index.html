
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Modern Era | Luxury Magazine</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            black: '#141414',
                            light: '#f9f9f9'
                        }
                    },
                    letterSpacing: {
                        'widest-plus': '0.4em',
                        'extreme': '0.8em'
                    }
                }
            }
        }
    </script>
    <style>
        .letter-spacing-extra { letter-spacing: 0.8em; }
        .fine-border { border: 0.5px solid #141414; }
        .fine-border-b { border-bottom: 0.5px solid #141414; }
        .fine-border-t { border-top: 0.5px solid #141414; }
        .fine-border-r { border-right: 0.5px solid #141414; }
        .fine-border-l { border-left: 0.5px solid #141414; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        
        .grayscale-hover {
            filter: grayscale(100%);
            transition: filter 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grayscale-hover:hover {
            filter: grayscale(0%);
        }
    </style>
