
<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calm - Retrouvez votre calme intérieur</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#1132d4',
              'background-dark': '#0a0d17',
              'glass': 'rgba(255, 255, 255, 0.08)',
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'aurora': 'aurora 20s ease infinite',
            },
            keyframes: {
              aurora: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              }
            }
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
      }
      .aurora-gradient {
        background: linear-gradient(217deg, rgba(17, 50, 212, 0.3), rgba(255, 0, 0, 0) 70.71%),
                    linear-gradient(127deg, rgba(168, 85, 247, 0.3), rgba(0, 255, 0, 0) 70.71%),
                    linear-gradient(336deg, rgba(236, 72, 153, 0.3), rgba(0, 0, 255, 0) 70.71%);
        background-size: 200% 200%;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.1; box-shadow: 0 0 20px 10px rgba(255,255,255,0.05); }
        50% { transform: scale(1.1); opacity: 0.2; box-shadow: 0 0 60px 30px rgba(255,255,255,0.1); }
      }
      .breathing-effect {
        animation: breathe 8s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-dark text-white font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
