
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Art Exhibition 2020</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;700&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#5c67f2",
              'retro-pink': "#ff69b4",
              'retro-teal': "#3df2d5",
              'retro-yellow': "#fff133",
              'retro-black': "#000000",
              'retro-white': "#ffffff",
            },
            fontFamily: {
              pixel: ["'Press Start 2P'", "cursive"],
              body: ["'Space Grotesk'", "sans-serif"],
              heading: ["'Rubik Mono One'", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-marquee {
        animation: marquee 20s linear infinite;
      }
      .pixel-shadow {
        box-shadow: 8px 8px 0px 0px rgba(0, 0, 0, 1);
      }
      .pixel-shadow-sm {
        box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
      }
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      .halftone {
        background-image: radial-gradient(circle, #000 1px, transparent 1px);
        background-size: 4px 4px;
        opacity: 0.1;
      }
      body {
        cursor: crosshair;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
