  <meta charset="utf-8" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://luminainteriors.com/" />
  <meta property="og:title" content="Lumina Interiors - Timeless Elegance" />
  <meta property="og:description" content="Award-winning interior design for residential and commercial spaces. Crafted with precision and elegance." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://luminainteriors.com/" />
  <meta property="twitter:title" content="Lumina Interiors - Timeless Elegance" />
  <meta property="twitter:description" content="Award-winning interior design for residential and commercial spaces. Crafted with precision and elegance." />
  <meta property="twitter:image" content="/og-image.jpg" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Spline+Sans:wght@300..700&display=swap"
    rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f9f506",
            "background-light": "#f8f8f5",
            "background-dark": "#23220f",
            "charcoal": "#1c1c0d",
            "sand": "#f4f4e6",
          },
          fontFamily: {
            "display": ["Spline Sans", "sans-serif"],
            "serif": ["Playfair Display", "serif"],
          },
          borderRadius: {
            "lg": "2rem",
            "xl": "3rem",
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Smooth scrolling for anchor links */
    html {
      scroll-behavior: smooth;
    }
  </style>

}
</script>

</html>
