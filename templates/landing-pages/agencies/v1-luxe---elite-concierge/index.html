
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1 LUXE | The Silent Authority in Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "#13a4ec",
                        "background-dark": "#0a0a0a",
                        "silver": {
                            "DEFAULT": "#c0c0c0",
                            "light": "#e5e5e5",
                            "dark": "#4a4a4a"
                        }
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: "Newsreader", serif;
            background-color: #0a0a0a;
            color: white;
        }
        .black-varnish {
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 80%), 
                        linear-gradient(45deg, rgba(20, 20, 20, 1) 0%, rgba(10, 10, 10, 1) 50%, rgba(20, 20, 20, 1) 100%);
            position: relative;
        }
        .black-varnish::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            opacity: 0.1;
            pointer-events: none;
        }
        .silver-text {
            background: linear-gradient(180deg, #fff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4a4a4a;
        }
    </style>
