
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UKYO DIGITAL | Japanese Fusion Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700;800&family=Noto+Sans+JP:wght@100;400;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1132d4",
                        vermilion: "#e63946",
                        washi: "#fdfaf6",
                        ink: "#101322",
                    },
                    fontFamily: {
                        sans: ['Manrope', 'Noto Sans JP', 'sans-serif'],
                        display: ['Manrope', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .grainy-overlay {
            background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            opacity: 0.15;
            pointer-events: none;
            mix-blend-mode: multiply;
        }
        @keyframes scroll-line {
            0% { height: 0; opacity: 1; transform-origin: top; }
            50% { height: 48px; opacity: 1; transform-origin: top; }
            51% { height: 48px; opacity: 1; transform-origin: bottom; }
            100% { height: 0; opacity: 1; transform-origin: bottom; }
        }
        .animate-scroll-line {
            animation: scroll-line 2s infinite ease-in-out;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
<script type="importmap">

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
