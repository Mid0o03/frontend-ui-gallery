    <!-- Twitter -->

    <meta property="twitter:url" content="https://midodev.fr/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Theme Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4299f0",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem", 
                        "lg": "2rem", 
                        "xl": "3rem", 
                        "2xl": "4rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'clay': '8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff',
                        'clay-dark': '8px 8px 16px #0d141b, -8px -8px 16px #131e29',
                        'clay-inset': 'inset 6px 6px 12px #b8b9be, inset -6px -6px 12px #ffffff',
                        'clay-inset-dark': 'inset 6px 6px 12px #0a0f15, inset -6px -6px 12px #16232f',
                        'floating': '0 20px 40px -10px rgba(66, 153, 240, 0.3)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 8s ease-in-out infinite 1s',
                        'float-slow': 'float 10s ease-in-out infinite 2s',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        /* Custom Utility Classes */
        .blob-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .clay-card {
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .clay-card {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        body {
            background-color: #f6f7f8;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #101922;
            }
        }
    </style>
