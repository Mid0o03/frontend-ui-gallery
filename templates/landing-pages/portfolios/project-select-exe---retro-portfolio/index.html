
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROJECT_SELECT.EXE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6a25f4",
                        "background-light": "#f6f5f8",
                        "background-dark": "#0a0a0c",
                        "card-dark": "#161022",
                        "neon-purple": "#b24bf3",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "pixel": ["'Press Start 2P'", "cursive"]
                    },
                    animation: {
                        'flicker': 'flicker 0.15s infinite',
                    },
                    keyframes: {
                        flicker: {
                            '0%': { opacity: '0.97' },
                            '100%': { opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        .star-field {
            background-image: radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                              radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                              radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }
        .crt-overlay::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
        .arcade-button {
            box-shadow: 0 4px 0px #4a1bb3;
            transition: all 0.1s ease;
        }
        .arcade-button:active {
            box-shadow: 0 0px 0px #4a1bb3;
            transform: translateY(4px);
        }
        .glow-border:hover {
            box-shadow: 0 0 30px rgba(106, 37, 244, 0.2);
        }
    </style>
