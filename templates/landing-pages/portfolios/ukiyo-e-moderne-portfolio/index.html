
<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ukiyo-e Moderne | Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#003153", // Prussian Blue
                        "vermilion": "#E34234", // Traditional Red
                        "aged-paper": "#FDF5E6", // Old Lace / Washi texture color
                        "background-dark": "#101a22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "traditional": ["Noto Serif JP", "serif"]
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                    }
                },
            },
        }
    </script>
    <style>
        .paper-grain {
            background-image: url(https://www.transparenttextures.com/patterns/rice-paper-2.png);
            background-color: #FDF5E6;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        .hanko-btn {
            writing-mode: vertical-rl;
            text-orientation: upright;
            transition: all 0.3s ease;
        }
        .hanko-btn:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .vertical-text {
                writing-mode: horizontal-tb;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-aged-paper dark:bg-background-dark font-display text-primary dark:text-gray-200 paper-grain transition-colors duration-300">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
